name: Récupérer les modèles de détection de visages

# Le conteneur de développement ne peut pas joindre storage.googleapis.com : ce workflow
# télécharge les modèles officiels MediaPipe (Apache-2.0), enregistre leur SHA-256 et les
# committe dans public/models/. Il se déclenche quand ce fichier est modifié.
on:
  push:
    paths:
      - .github/workflows/fetch-models.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          mkdir -p public/models
          base=https://storage.googleapis.com/mediapipe-models/face_detector
          for m in blaze_face_full_range; do
            url="$base/$m/float16/1/$m.tflite"
            if curl -fsSL --retry 3 -o "public/models/$m.tflite" "$url"; then
              echo "OK  $url ($(stat -c %s public/models/$m.tflite) octets)"
            else
              echo "ABSENT $url"
              rm -f "public/models/$m.tflite"
            fi
          done
          (cd public/models && sha256sum *.tflite > SHA256SUMS && cat SHA256SUMS)
          # Empreinte figée dans src/lib/media/face-tracker.ts : toute différence doit être examinée.
          grep -q 3698b18f063835bc609069ef052228fbe86d9c9a6dc8dcb7c7c2d69aed2b181b public/models/SHA256SUMS || { echo "::error::Le modèle a changé"; exit 1; }
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Modèles MediaPipe de détection de visages (téléchargés par GitHub Actions)"
          git push
