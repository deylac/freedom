name: Miroirs (déploiement multi-hébergeurs et liste signée)

# Chaque version validée par la CI est publiée sur TOUS les hébergeurs configurés, puis la liste des
# miroirs qui répondent est signée par la clé du projet et publiée sur Nostr : une application déjà
# installée apprend ainsi les nouvelles adresses même si les anciennes sont bloquées. Chaque copie
# embarque aussi la liste des miroirs à adresse fixe (VITE_MIRRORS) : les miroirs s'auto-référencent.
#
# Rien n'est obligatoire : un hébergeur sans ses secrets est simplement ignoré (voir docs/MIROIRS.md).
# Le passage quotidien republie la liste signée (les relais peuvent oublier les vieux événements).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrors
  cancel-in-progress: true

env:
  # Adresses FIXES des miroirs (variable du dépôt, séparées par des espaces), ex. :
  # "https://deylac.github.io/freedom/ https://hashwall.pages.dev/ https://hashwall.netlify.app/"
  VITE_MIRRORS: ${{ vars.HASHWALL_MIRRORS }}
  VITE_PROJECT_NPUB: ${{ vars.HASHWALL_PROJECT_NPUB }}
  VITE_SITE_URL: ${{ vars.HASHWALL_SITE_URL }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CF_PAGES_PROJECT == ''
        run: echo "Cloudflare Pages non configuré (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, variable CF_PAGES_PROJECT) — ignoré."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        run: npx --yes wrangler@4.151.1 pages deploy site --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true

  netlify:
    needs: build
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: echo "Netlify non configuré (NETLIFY_AUTH_TOKEN, variable NETLIFY_SITE_ID) — ignoré."
      - if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@27.13.0 deploy --dir site --prod --site "$NETLIFY_SITE_ID" --no-build

  codeberg:
    # Codeberg Pages : hébergeur associatif européen (Allemagne), indépendant de GitHub et des GAFAM.
    needs: build
    runs-on: ubuntu-latest
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}
    steps:
      - if: env.CODEBERG_TOKEN == '' || env.CODEBERG_REPO == ''
        run: echo "Codeberg Pages non configuré (CODEBERG_TOKEN, variable CODEBERG_REPO=utilisateur/depot) — ignoré."
      - if: env.CODEBERG_TOKEN != '' && env.CODEBERG_REPO != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - if: env.CODEBERG_TOKEN != '' && env.CODEBERG_REPO != ''
        working-directory: site
        run: |
          git init -q -b pages
          git config user.name "HashWall (miroir automatique)"
          git config user.email "mirror@hashwall.invalid"
          git add -A
          git commit -q -m "Miroir de ${GITHUB_SHA::7}"
          git push -q --force "https://oauth2:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git" pages

  ipfs:
    # IPFS épinglé chez Pinata : adresse par empreinte (CID), servie par toutes les passerelles IPFS.
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.pin.outputs.url }}
    env:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
    steps:
      - if: env.PINATA_JWT == ''
        run: echo "IPFS non configuré (secret PINATA_JWT) — ignoré."
      - if: env.PINATA_JWT != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: hashwall
      - if: env.PINATA_JWT != ''
        id: pin
        run: |
          args=()
          while IFS= read -r f; do args+=(-F "file=@${f};filename=${f}"); done < <(find hashwall -type f)
          res=$(curl -sS --fail -H "Authorization: Bearer ${PINATA_JWT}" "${args[@]}" \
            -F "pinataMetadata={\"name\":\"hashwall-${GITHUB_SHA::7}\"}" \
            https://api.pinata.cloud/pinning/pinFileToIPFS)
          cid=$(echo "$res" | python3 -c "import sys,json;print(json.load(sys.stdin)['IpfsHash'])")
          echo "CID : $cid"
          # Passerelle par sous-domaine : chaque site a sa propre origine (stockage local, service worker).
          echo "url=https://${cid}.ipfs.dweb.link/" >> "$GITHUB_OUTPUT"

  announce:
    # Vérifie quels miroirs répondent, puis publie la liste SIGNÉE (kind 30078) sur les relais.
    needs: [build, cloudflare, netlify, codeberg, ipfs]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      HASHWALL_PROJECT_NSEC: ${{ secrets.HASHWALL_PROJECT_NSEC }}
      IPFS_URL: ${{ needs.ipfs.outputs.url }}
      EXTRA: ${{ vars.HASHWALL_MIRRORS_EXTRA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Vérifier les miroirs
        run: |
          list=()
          for u in $VITE_MIRRORS; do list+=("$u"); done
          [ -n "$IPFS_URL" ] && list+=("$IPFS_URL|IPFS")
          # Miroirs supplémentaires gérés à la main (ex. « http://xxxx.onion/|Tor »).
          for u in $EXTRA; do list+=("$u"); done
          if [ ${#list[@]} -eq 0 ]; then echo "Aucun miroir déclaré (variable HASHWALL_MIRRORS)."; exit 0; fi
          node scripts/check-mirrors.mjs "${list[@]}" > ok.txt || true
          echo "Miroirs retenus :"; cat ok.txt
      - name: Publier la liste signée
        if: env.HASHWALL_PROJECT_NSEC != ''
        run: |
          [ -s ok.txt ] || { echo "Aucun miroir joignable : liste inchangée."; exit 0; }
          # Les adresses .onion ne sont pas joignables depuis le lanceur : ajoutées telles quelles.
          mapfile -t ok < ok.txt
          for u in $EXTRA; do case "$u" in *.onion*) ok+=("$u");; esac; done
          node scripts/publish-mirrors.mjs "${ok[@]}"
      - if: env.HASHWALL_PROJECT_NSEC == ''
        run: echo "Clé du projet absente (secret HASHWALL_PROJECT_NSEC) — liste signée non publiée."
