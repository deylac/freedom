name: Déployer sur GitHub Pages

# Déploiement conditionné à la réussite de la CI (typecheck, tests, build, E2E) sur le MÊME commit
# (recommandation de l'audit du 1ᵉʳ nov. 2026 : avant, Pages publiait même si les tests échouaient).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Même liste de miroirs que les autres hébergeurs (voir mirrors.yml et docs/MIROIRS.md).
          VITE_MIRRORS: ${{ vars.HASHWALL_MIRRORS }}
          VITE_PROJECT_NPUB: ${{ vars.HASHWALL_PROJECT_NPUB }}
          VITE_SITE_URL: ${{ vars.HASHWALL_SITE_URL }}
      - run: node --check dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
